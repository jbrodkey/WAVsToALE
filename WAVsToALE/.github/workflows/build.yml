name: Build WAVsToALE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build app (PyInstaller using spec file)
        run: |
          python -m PyInstaller WAVsToALE.spec

      - name: Include macOS README in onedir
        run: |
          if [ -f "docs/README_mac.rtf" ]; then
            cp docs/README_mac.rtf dist/WAVsToALE/README.rtf
          else
            echo "README_mac.rtf not found, skipping..."
          fi

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: macos-onedir
          path: dist/WAVsToALE

      - name: Validate macOS app bundle
        run: |
          chmod +x validate_bundle.sh
          ./validate_bundle.sh

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        run: |
          python -m py_compile wav_to_ale_with_bext_xml_v2_plusUCS-Parsing.py

      - name: Build exe (PyInstaller using spec file)
        run: |
          pyinstaller WAVsToALE.spec

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WAVsToALE/WAVsToALE.exe

      - name: Create distribution package (zip)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          cd dist
          # The spec file creates dist/WAVsToALE/ folder with exe and data
          # Platform-specific README (Windows)
          $repoRoot = Split-Path -Parent (Get-Location)
          $winReadme = Join-Path $repoRoot 'docs/README_windows.rtf'
          if (Test-Path $winReadme) {
            Copy-Item $winReadme 'WAVsToALE/README.rtf' -ErrorAction SilentlyContinue
          } else {
            Write-Host 'Windows README not found, skipping...'
          }
          # Zip the folder
          Compress-Archive -Path 'WAVsToALE' -DestinationPath 'WAVsToALE-Windows-v1.0.1.zip'
          Get-ChildItem

      - name: Upload distribution package
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/WAVsToALE-Windows-v1.0.1.zip

      - name: Validate Windows build
        shell: cmd
        run: |
          validate_windows.bat
