name: Build WAVsToALE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build app (PyInstaller)
        run: |
          python -m PyInstaller --onedir --windowed \
            --name WAVsToALE \
            --hidden-import=tkinter \
            --hidden-import=tkinter.ttk \
            --hidden-import=tkinter.filedialog \
            --hidden-import=tkinter.messagebox \
            --hidden-import=tkinter.font \
            --hidden-import=tkinter.scrolledtext \
            --add-data data/UCS_v8.2.1_Full_List.csv:data \
            wav_to_ale_with_bext_xml_v2_plusUCS-Parsing.py

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: macos-onedir
          path: dist/WAVsToALE

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Syntax check
        run: |
          python -m py_compile wav_to_ale_with_bext_xml_v2_plusUCS-Parsing.py

      - name: Ensure UCS CSV in expected path
        shell: bash
        run: |
          set -e
          # Copy from data/ to root if not present
          if [ ! -f "UCS_v8.2.1_Full_List.csv" ]; then
            cp data/UCS_v8.2.1_Full_List.csv UCS_v8.2.1_Full_List.csv
          fi

      - name: Build exe (PyInstaller)
        run: |
          pyinstaller --onefile \
            --name WAVsToALE \
            --add-data "UCS_v8.2.1_Full_List.csv;." \
            wav_to_ale_with_bext_xml_v2_plusUCS-Parsing.py

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/WAVsToALE.exe

      - name: Create distribution package (zip)
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          cd dist
          # Prepare folder
          if (Test-Path 'WAVsToALE') { Remove-Item -Path 'WAVsToALE' -Recurse -Force }
          New-Item -ItemType Directory -Path 'WAVsToALE' | Out-Null
          # Copy exe
          Copy-Item 'WAVsToALE.exe' 'WAVsToALE/'
          # Optional README (skip if missing)
          $readmePath = Join-Path (Split-Path -Parent (Split-Path -Parent (Get-Location))) 'WAVsToALE README.rtf'
          if (Test-Path $readmePath) {
            Copy-Item $readmePath 'WAVsToALE/' -ErrorAction SilentlyContinue
          } else {
            Write-Host 'README file not found, skipping...'
          }
          # Zip
          Compress-Archive -Path 'WAVsToALE' -DestinationPath 'WAVsToALE-Windows-v1.0.1.zip'
          Get-ChildItem

      - name: Upload distribution package
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: dist/WAVsToALE-Windows-v1.0.1.zip
